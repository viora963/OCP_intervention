{% extends 'core/base.html' %}
{% block title %}Supprimer client — OCP{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card text-center">
    <h1 class="text-xl font-bold text-gray-900 mb-2">Confirmer la suppression</h1>
    <p class="text-gray-600 mb-6">Êtes-vous sûr de vouloir supprimer <strong>{{ client.nom }}</strong> ? Cette action est irréversible.</p>
    <form method="post" class="flex justify-center gap-3">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Supprimer</button>
        <a href="{% url 'client_list' %}" class="btn-secondary">Annuler</a>
    </form>
</div>
{% endblock %}
