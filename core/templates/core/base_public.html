{% load static %}
<!DOCTYPE html>
<html lang="fr" x-data="{ darkMode: false }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}OCP Gestion Interventions{% endblock %}</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.1/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">    <link rel="stylesheet" href="{% static 'core/css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/ocp-theme.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/tailwind-built.css' %}">
    <script src="{% static 'core/js/app.js' %}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50/80 text-gray-800 min-h-screen antialiased">
    {% if messages %}
    <div class="fixed top-4 right-4 z-[60] space-y-2 w-80">
        {% for message in messages %}
        <div class="django-msg p-4 rounded-xl border shadow-lg {% if message.tags == 'error' %}bg-red-50 text-red-700 border-red-200{% elif message.tags == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-200{% else %}bg-ocp-50 text-ocp-700 border-ocp-200{% endif %}">
            <span class="text-sm font-medium">{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
    {% block extra_body %}{% endblock %}
</body>
</html>
